<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D32F2F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main Jersey Body -->
  <path d="M 70 40 L 70 150 Q 70 160 80 160 L 120 160 Q 130 160 130 150 L 130 40 Z" fill="url(#mainGrad)" stroke="#333" stroke-width="2"/>
  
  <!-- Jersey Sleeves/Shoulders -->
  <ellipse cx="60" cy="60" rx="18" ry="25" fill="url(#accentGrad)" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="140" cy="60" rx="18" ry="25" fill="url(#accentGrad)" stroke="#333" stroke-width="1.5"/>
  
  <!-- Neck Circle -->
  <circle cx="100" cy="40" r="16" fill="#0f0f0f" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Collar V-neck detail -->
  <path d="M 90 45 L 100 55 L 110 45" fill="none" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Center Stripe -->
  <rect x="96" y="55" width="8" height="95" fill="url(#accentGrad)" opacity="0.9"/>
  
  <!-- Main Badge/Shield -->
  <g>
    <circle cx="100" cy="90" r="28" fill="url(#accentGrad)" stroke="#FFD700" stroke-width="2.5"/>
    <text x="100" y="102" font-size="42" font-weight="bold" text-anchor="middle" fill="#FFD700" font-family="Arial Black">JL</text>
  </g>
  
  <!-- Decorative Stars around badge -->
  <g fill="#FFD700">
    <polygon points="75,70 78,78 87,78 80,84 83,92 75,86 67,92 70,84 63,78 72,78" />
    <polygon points="125,70 128,78 137,78 130,84 133,92 125,86 117,92 120,84 113,78 122,78" />
  </g>
  
  <!-- Side Accents -->
  <rect x="68" y="70" width="4" height="60" fill="#FFD700" opacity="0.7" rx="2"/>
  <rect x="128" y="70" width="4" height="60" fill="#FFD700" opacity="0.7" rx="2"/>
  
  <!-- Bottom Trim -->
  <ellipse cx="100" cy="161" rx="32" ry="6" fill="#333" opacity="0.5"/>
  
  <!-- Shine effect -->
  <ellipse cx="85" cy="70" rx="8" ry="15" fill="white" opacity="0.15" />
</svg>